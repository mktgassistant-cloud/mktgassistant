<!--
  ============================================================================
  CASE STUDY CARDS + MODAL: paste-into-GoHighLevel block
  ============================================================================
  HOW TO USE
    1. In the GHL funnel/page builder add a "Custom Code" (or "Code") element,
       full page width, and paste this ENTIRE file into it.
    2. Edit only the CASE_STUDIES array below. Everything (cards + modals) is
       generated from it, so a card and its detail view can never drift apart.
    3. Search for "TODO" to find every spot that still needs your copy,
       avatar URL, quote, or video.

  WHAT TO EDIT PER CASE STUDY
    id        - short slug, used for the #case=<id> deep link. Keep unique.
    name      - name shown on the card and in the modal header
    category  - small gold line under the name
    avatar    - square image URL (use the GHL media library). Leave "" and the
                card falls back to the person's initials.
    accent    - main color: the big number + left half of the top bar
    accent2   - right half of the top bar gradient (omit to reuse accent)
    stat      - the big headline number on the card
    statLabel - small grey line under it
    summary   - 2-3 sentence card blurb
    modal.name     - optional. Header name for the modal only, when it should
                     differ from the card (e.g. card "Ronnie", modal
                     "Ronnie, eSimplicity"). Omit to reuse name.
    modal.headline - bold line at the top of the modal
    modal.stats    - 2 or 4 stat tiles: { value, label }
    modal.quote    - { text, author }. Omit the whole key to hide the quote.
    modal.video    - full EMBED url, e.g. https://www.youtube.com/embed/XXXX
                     omit to hide the player (no empty black box)
    modal.sections - [{ label, html }]. label renders as the small gold
                     all-caps heading. Empty html is skipped automatically.
                     Inside html, use <p class="cs-pull"> for a short quote
                     set into the body copy.
    modal.cta      - { text, href }. Button at the bottom. Omit to hide.
    modal.disclaimer - small grey print under the CTA. Omit to hide.

  NOTES
    * All CSS is namespaced under .cs-wrap / .cs-* so it cannot collide with
      GHL's own styles, and the JS lives in one IIFE (no globals leaked).
    * On load the modal is moved to <body> so GHL sections with overflow or
      transforms can't break position:fixed. This is the #1 reason DIY GHL
      modals appear clipped or behind other elements.
    * Fully keyboard accessible: Tab reaches each card's button, Esc closes,
      focus is trapped in the dialog and returned to the card on close.
    * Arrow keys / the ‹ › buttons move between case studies inside the modal.
  ============================================================================
-->

<style>
  /* Design tokens live on BOTH roots: the modal is relocated to <body> at
     runtime, so it can't inherit variables from .cs-wrap. */
  .cs-wrap,
  .cs-modal {
    /* ---- brand knobs: change these 9 lines to restyle the whole block ---- */
    --cs-gold: #e7b92f;
    --cs-gold-soft: #d2a72a;
    --cs-card-bg: #17161a;
    --cs-modal-bg: #1c1b20;
    --cs-tile-bg: #232127;
    --cs-line: #2e2c33;
    --cs-text: #ffffff;
    --cs-body: #ded9d4;
    --cs-muted: #a7a19b;

    --cs-gap: 18px;
    --cs-max: 1240px;
    --cs-radius: 16px;
  }

  .cs-wrap {
    --cs-cols: 4;

    display: block;
    width: 100%;
    max-width: 100%;
    margin: 0 auto;
    padding: 8px 0;
    color: var(--cs-text);
    font-family: var(--cs-font, inherit);
    -webkit-font-smoothing: antialiased;
  }

  .cs-wrap *,
  .cs-wrap *::before,
  .cs-wrap *::after {
    box-sizing: border-box;
  }

  /* ---------------------------------------------------------------- grid -- */
  .cs-grid {
    display: grid;
    grid-template-columns: repeat(var(--cs-cols), minmax(0, 1fr));
    gap: var(--cs-gap);
    width: 100%;
    max-width: var(--cs-max);
    margin: 0 auto;
    padding: 0;
    list-style: none;
  }

  /* With fewer than 4 case studies the JS adds .cs-n1 / .cs-n2 / .cs-n3 so a
     small set stays centered at a natural card width instead of stretching
     across a 4-column track. The responsive overrides at the bottom of this
     stylesheet use the same specificity and come later, so they still win. */
  .cs-wrap.cs-n1 {
    --cs-cols: 1;
    --cs-max: 400px;
  }

  .cs-wrap.cs-n2 {
    --cs-cols: 2;
    --cs-max: 760px;
  }

  .cs-wrap.cs-n3 {
    --cs-cols: 3;
    --cs-max: 1060px;
  }

  /* --------------------------------------------------------------- card -- */
  .cs-card {
    position: relative;
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 26px 22px 22px;
    overflow: hidden;
    text-align: left;
    background: var(--cs-card-bg);
    border: 1px solid var(--cs-line);
    border-radius: var(--cs-radius);
    cursor: pointer;
    transition: transform 0.22s ease, box-shadow 0.22s ease,
      border-color 0.22s ease;
  }

  /* two-tone accent bar across the top of every card */
  .cs-card::before {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    left: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--cs-a), var(--cs-b));
  }

  .cs-card:hover,
  .cs-card:focus-within {
    transform: translateY(-6px);
    border-color: color-mix(in srgb, var(--cs-a) 45%, var(--cs-line));
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
  }

  .cs-person {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
  }

  .cs-avatar {
    display: flex;
    width: 46px;
    height: 46px;
    flex: 0 0 46px;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    color: var(--cs-gold);
    background: #262429;
    border: 2px solid color-mix(in srgb, var(--cs-gold) 70%, transparent);
    border-radius: 50%;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .cs-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
  }

  .cs-name {
    margin: 0 0 3px;
    color: var(--cs-text);
    font-size: 16px;
    font-weight: 700;
    line-height: 1.2;
  }

  .cs-cat {
    margin: 0;
    color: var(--cs-gold);
    font-size: 12px;
    font-weight: 500;
    line-height: 1.35;
  }

  .cs-stat {
    margin: 0 0 6px;
    color: var(--cs-a);
    font-size: 30px;
    font-weight: 800;
    line-height: 1.12;
    letter-spacing: -0.5px;
  }

  /* text headlines like "Laid Off to $90K Remote" need to step down so they
     don't wrap into three or four lines */
  .cs-stat.is-long {
    font-size: 24px;
  }

  .cs-stat.is-xlong {
    font-size: 21px;
    letter-spacing: -0.2px;
  }

  .cs-statlab {
    margin: 0 0 16px;
    color: var(--cs-muted);
    font-size: 12.5px;
    line-height: 1.45;
  }

  .cs-sum {
    margin: 0 0 22px;
    color: var(--cs-body);
    font-size: 14px;
    line-height: 1.6;
  }

  .cs-more {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    align-self: flex-start;
    margin-top: auto;
    padding: 2px 0;
    color: var(--cs-gold-soft);
    background: none;
    border: 0;
    border-radius: 4px;
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  .cs-more span {
    transition: transform 0.2s ease;
  }

  .cs-card:hover .cs-more,
  .cs-more:hover {
    color: #f4d16a;
  }

  .cs-card:hover .cs-more span {
    transform: translateX(4px);
  }

  .cs-more:focus-visible,
  .cs-nav:focus-visible,
  .cs-close:focus-visible,
  .cs-cta:focus-visible {
    outline: 2px solid var(--cs-gold);
    outline-offset: 3px;
  }

  .cs-sr {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* -------------------------------------------------------------- modal -- */
  .cs-modal {
    position: fixed;
    z-index: 2147483000; /* above GHL headers, chat widgets and sticky bars */
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 28px 20px;
    font-family: var(--cs-font, inherit);
  }

  .cs-modal.is-open {
    display: flex;
  }

  .cs-modal *,
  .cs-modal *::before,
  .cs-modal *::after {
    box-sizing: border-box;
  }

  .cs-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.82);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    animation: cs-fade 0.2s ease both;
  }

  .cs-dialog {
    position: relative;
    z-index: 1;
    width: min(780px, 100%);
    max-height: min(88vh, 900px);
    padding: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    color: var(--cs-text);
    background: var(--cs-modal-bg);
    border: 1px solid var(--cs-line);
    border-radius: 20px;
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.65);
    animation: cs-rise 0.24s cubic-bezier(0.2, 0.8, 0.3, 1) both;
    scrollbar-width: thin;
  }

  .cs-dialog::before {
    content: "";
    position: sticky;
    top: 0;
    display: block;
    height: 4px;
    background: linear-gradient(90deg, var(--cs-a), var(--cs-b));
  }

  @keyframes cs-fade {
    from {
      opacity: 0;
    }
  }

  @keyframes cs-rise {
    from {
      opacity: 0;
      transform: translateY(18px) scale(0.985);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .cs-card,
    .cs-more span,
    .cs-overlay,
    .cs-dialog {
      transition: none;
      animation: none;
    }

    .cs-card:hover {
      transform: none;
    }
  }

  .cs-inner {
    padding: 56px 34px 34px;
  }

  /* zero-height sticky row: the controls float over the content and stay put
     while the dialog scrolls, without reserving layout space */
  .cs-topbar {
    position: sticky;
    top: 4px;
    z-index: 3;
    display: flex;
    align-items: flex-start;
    justify-content: flex-end;
    gap: 8px;
    height: 0;
    padding: 0 16px;
    pointer-events: none;
  }

  .cs-nav,
  .cs-close {
    margin-top: 14px;
    pointer-events: auto;
    display: flex;
    width: 36px;
    height: 36px;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    padding: 0;
    color: #cfcac4;
    background: rgba(38, 36, 41, 0.92);
    border: 1px solid var(--cs-line);
    border-radius: 50%;
    font: inherit;
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
    transition: color 0.18s ease, background 0.18s ease;
  }

  .cs-close {
    font-size: 22px;
  }

  /* the .cs-nav display:flex above outranks the UA [hidden] rule, so the
     prev/next buttons need this to actually disappear for a single card */
  .cs-nav[hidden],
  .cs-close[hidden] {
    display: none;
  }

  /* scrim so body copy fades out under the sticky controls instead of
     colliding with them */
  .cs-topbar::before {
    content: "";
    position: absolute;
    top: -4px;
    right: 0;
    left: 0;
    height: 62px;
    background: linear-gradient(
      to bottom,
      var(--cs-modal-bg) 40%,
      rgba(28, 27, 32, 0)
    );
    pointer-events: none;
  }

  .cs-nav:hover,
  .cs-close:hover {
    color: #fff;
    background: #34313a;
  }

  .cs-modal-person {
    display: flex;
    align-items: center;
    gap: 13px;
    margin: 0 0 22px;
  }

  .cs-modal-name {
    margin: 0 0 3px;
    font-size: 17px;
    font-weight: 700;
    line-height: 1.2;
  }

  .cs-headline {
    margin: 0 0 22px;
    font-size: clamp(21px, 2.5vw, 27px);
    font-weight: 800;
    line-height: 1.3;
    letter-spacing: -0.4px;
  }

  .cs-stats {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin: 0 0 24px;
    padding: 0;
    list-style: none;
  }

  .cs-tile {
    padding: 18px 12px;
    text-align: center;
    background: var(--cs-tile-bg);
    border: 1px solid var(--cs-line);
    border-radius: 12px;
  }

  .cs-tile-v {
    display: block;
    font-size: 22px;
    font-weight: 800;
    line-height: 1.15;
  }

  .cs-tile-l {
    display: block;
    margin-top: 5px;
    color: var(--cs-muted);
    font-size: 11.5px;
    line-height: 1.4;
  }

  .cs-quote {
    margin: 0 0 26px;
    padding: 18px 20px;
    color: #efece8;
    background: var(--cs-tile-bg);
    border: 0;
    border-left: 3px solid var(--cs-a);
    border-radius: 10px;
    font-size: 15px;
    font-style: italic;
    line-height: 1.65;
  }

  .cs-quote footer {
    margin-top: 10px;
    color: var(--cs-muted);
    font-size: 13px;
    font-style: normal;
  }

  .cs-video {
    position: relative;
    margin: 0 0 26px;
    padding-top: 56.25%;
    overflow: hidden;
    background: #000;
    border-radius: 12px;
  }

  .cs-video iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .cs-body {
    color: var(--cs-body);
    font-size: 15px;
    line-height: 1.72;
  }

  .cs-sec-label {
    margin: 0 0 8px;
    color: var(--cs-gold);
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 1.4px;
    text-transform: uppercase;
  }

  .cs-sec + .cs-sec {
    margin-top: 24px;
  }

  .cs-sec p {
    margin: 0 0 12px;
  }

  .cs-sec p:last-child {
    margin-bottom: 0;
  }

  .cs-sec ul {
    margin: 0 0 12px;
    padding-left: 20px;
  }

  .cs-sec li {
    margin-bottom: 7px;
  }

  .cs-sec strong {
    color: #fff;
  }

  /* short quotes set inside a section's body copy */
  .cs-sec .cs-pull {
    margin: 18px 0;
    padding-left: 16px;
    color: #fff;
    border-left: 2px solid color-mix(in srgb, var(--cs-a) 65%, transparent);
    font-size: 15.5px;
    font-style: italic;
    line-height: 1.6;
  }

  .cs-disclaimer {
    margin: 24px 0 0;
    color: var(--cs-muted);
    font-size: 11.5px;
    line-height: 1.6;
  }

  .cs-cta {
    display: inline-block;
    margin-top: 28px;
    padding: 14px 28px;
    color: #17161a;
    background: var(--cs-gold);
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    transition: filter 0.18s ease;
  }

  .cs-cta:hover {
    filter: brightness(1.08);
  }

  .cs-count {
    margin: 26px 0 0;
    color: var(--cs-muted);
    font-size: 12px;
    letter-spacing: 0.4px;
  }

  /* --------------------------------------------------------- responsive -- */
  @media (max-width: 1080px) {
    .cs-wrap.cs-wrap {
      --cs-cols: 2;
      --cs-max: 760px;
    }
  }

  @media (max-width: 620px) {
    .cs-wrap.cs-wrap {
      --cs-cols: 1;
      --cs-max: 460px;
      --cs-gap: 14px;
    }

    .cs-card {
      padding: 24px 20px 20px;
    }

    /* full-height sheet on phones */
    .cs-modal {
      padding: 0;
    }

    .cs-dialog {
      width: 100%;
      max-height: 100%;
      height: 100%;
      border: 0;
      border-radius: 0;
    }

    .cs-inner {
      padding: 54px 20px 44px;
    }

    .cs-stats {
      gap: 10px;
    }

    .cs-tile {
      padding: 14px 8px;
    }

    .cs-tile-v {
      font-size: 18px;
    }
  }
</style>

<section class="cs-wrap" id="cs-wrap">
  <ul class="cs-grid" id="cs-grid"><!-- cards render here --></ul>
</section>

<div class="cs-modal" id="cs-modal" hidden>
  <div class="cs-overlay" data-cs-close></div>

  <div
    class="cs-dialog"
    id="cs-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="cs-headline"
    tabindex="-1"
  >
    <div class="cs-topbar">
      <button class="cs-nav" type="button" id="cs-prev" aria-label="Previous case study">&#8249;</button>
      <button class="cs-nav" type="button" id="cs-next" aria-label="Next case study">&#8250;</button>
      <button class="cs-close" type="button" data-cs-close aria-label="Close case study">&times;</button>
    </div>

    <div class="cs-inner" id="cs-inner"><!-- detail renders here --></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ==========================================================================
     1. CONFIG
     ========================================================================== */
  var CONFIG = {
    deepLink: true,   // support /page#case=ronnie and update the hash on open
    showCount: true,  // "Case study 1 of N" line, only shows with 2+ cards
    arrowKeys: true   // ← / → move between case studies while the modal is open
  };

  /* ==========================================================================
     2. YOUR CASE STUDIES: the only thing you need to edit
     ========================================================================== */
  var CASE_STUDIES = [
    {
      id: "ronnie",
      name: "Ronnie",
      category: "Data and Business Analytics, Laid Off at Accenture",
      avatar: "", // TODO: paste Ronnie's photo URL from the GHL media library
      accent: "#22b8f5",
      accent2: "#5b7cfa",
      stat: "Laid Off to $90K Remote",
      statLabel: "30 Days From Program Start \u00b7 Offer Before Graduation",
      summary:
        "Hundreds of applications a week and zero final interviews. Thirty " +
        "days after starting DIM: eight to ten phone screens weekly, three " +
        "to four final rounds, and a $90K fully remote offer.",
      modal: {
        // shown only in the modal header; the card stays "Ronnie"
        name: "Ronnie, eSimplicity",
        headline:
          "Laid Off at Accenture to a $90K Fully Remote Offer in 30 Days",
        stats: [
          { value: "$90K", label: "Offer Salary, Fully Remote" },
          { value: "30 Days", label: "Program Start to Offer" },
          { value: "1-2 to 8-10", label: "Phone Screens Per Week" },
          { value: "0 to 3-4", label: "Final Round Interviews Per Week" }
        ],
        quote: {
          text:
            "I got that final offer in about thirty days. I was relieved. " +
            "I could end my search.",
          author: "Ronnie, Data Analyst at eSimplicity"
        },
        // video: "https://www.youtube.com/embed/VIDEO_ID",  // TODO: add if there is one
        sections: [
          {
            label: "Their path before DIM",
            html:
              "<p>Three years at Accenture in data and business analytics, " +
              "then the tech layoffs hit. Ronnie was not a beginner. He had " +
              "the title, the firm, and the experience. What he did not have " +
              "was a job, and the market did not care about his resume.</p>" +

              "<p>Job searching became the job. LinkedIn every morning, " +
              "roughly 200 applications a week, plus cold outreach to " +
              "everyone in his network. The return was about two phone " +
              "screens per hundred applications, and some weeks nothing at " +
              "all. Zero final rounds. Zero offers.</p>" +

              '<p class="cs-pull">&ldquo;It honestly became a full time job ' +
              "at that point looking for a job.&rdquo;</p>" +

              "<p>He assumed the market was the whole problem, until he " +
              "started considering that his strategy might be the other " +
              "half of it.</p>" +

              '<p class="cs-pull">&ldquo;What I&rsquo;m doing clearly ' +
              "isn&rsquo;t bringing in any success right now.&rdquo;</p>"
          },
          {
            label: "What we did",
            html:
              "<p>Paired him with a 1-on-1 mentor who built the plan around " +
              "his actual constraint, which was cash and not curriculum. The " +
              "goal was not to make him a better analyst. It was to get an " +
              "offer fast.</p>" +

              "<ul>" +
                "<li>Repositioned the resume so three years of Accenture " +
                "work read as outcomes rather than duties</li>" +
                "<li>Restructured application volume into a daily system: " +
                "80 to 100 per day instead of 200 per week</li>" +
                "<li>Rebuilt interview answers around specific lived " +
                "experience and depth instead of textbook responses</li>" +
                "<li>Upgraded the portfolio from projects that demonstrate " +
                "tools to projects that answer complex business questions " +
                "and lead with the recommendation</li>" +
                "<li>Plugged him into the private community for peer " +
                "accountability and unlisted job leads</li>" +
              "</ul>"
          },
          {
            label: "Results",
            html:
              "<p>Weekly phone screens went from one or two, sometimes zero, " +
              "to eight to ten. Of those, three to four per week reached " +
              "final rounds, a stage he had not reached once before the " +
              "program.</p>" +

              "<p>Application volume went up roughly 2.5 times, but the " +
              "response rate also more than doubled, from about 0.75 percent " +
              "to 1.8 percent. Both levers moved.</p>" +

              "<p>Thirty days after starting, he accepted a $90K fully " +
              "remote offer from eSimplicity, before the program ended.</p>" +

              "<p>The change he flags as the real one:</p>" +

              '<p class="cs-pull">&ldquo;I kinda know the strategy that I ' +
              "have to take from end to end, from applying all the way to " +
              "that final interview and offer.&rdquo;</p>" +

              "<p>He did not just get a job. He stopped depending on luck to " +
              "get the next one.</p>"
          }
        ],
        cta: { text: "Book a Free Call", href: "#book" }, // TODO: real booking link
        disclaimer:
          "Individual results vary. Outcomes depend on effort, prior " +
          "experience, and market conditions. Not all students secure offers."
      }
    }
  ];

  /* ==========================================================================
     3. ENGINE: no need to touch anything below this line
     ========================================================================== */
  var wrap = document.getElementById("cs-wrap");
  var grid = document.getElementById("cs-grid");
  var modal = document.getElementById("cs-modal");
  var dialog = document.getElementById("cs-dialog");
  var inner = document.getElementById("cs-inner");
  var prevBtn = document.getElementById("cs-prev");
  var nextBtn = document.getElementById("cs-next");

  if (!grid || !modal) return;

  var current = -1;
  var lastFocus = null;
  var scrollLocked = false;

  function esc(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function initials(name) {
    return String(name || "")
      .replace(/\(.*?\)/g, "")
      .trim()
      .split(/\s+/)
      .slice(0, 2)
      .map(function (w) { return w.charAt(0).toUpperCase(); })
      .join("");
  }

  function avatarHTML(cs) {
    if (cs.avatar) {
      return '<span class="cs-avatar"><img src="' + esc(cs.avatar) +
        '" alt="" loading="lazy" decoding="async"></span>';
    }
    return '<span class="cs-avatar" aria-hidden="true">' +
      esc(initials(cs.name)) + "</span>";
  }

  /* ---------------------------------------------------------------- cards -- */
  function renderCards() {
    if (CASE_STUDIES.length < 4) wrap.className += " cs-n" + CASE_STUDIES.length;

    grid.innerHTML = CASE_STUDIES.map(function (cs, i) {
      var len = String(cs.stat).length;
      var longStat = len > 18 ? " is-xlong" : len > 11 ? " is-long" : "";

      return (
        '<li>' +
          '<article class="cs-card" data-cs-index="' + i + '" style="--cs-a:' +
            esc(cs.accent) + ";--cs-b:" + esc(cs.accent2 || cs.accent) + '">' +
            '<div class="cs-person">' +
              avatarHTML(cs) +
              "<div>" +
                '<h3 class="cs-name">' + esc(cs.name) + "</h3>" +
                '<p class="cs-cat">' + esc(cs.category) + "</p>" +
              "</div>" +
            "</div>" +
            '<p class="cs-stat' + longStat + '">' + esc(cs.stat) + "</p>" +
            '<p class="cs-statlab">' + esc(cs.statLabel) + "</p>" +
            '<p class="cs-sum">' + esc(cs.summary) + "</p>" +
            '<button class="cs-more" type="button" aria-haspopup="dialog">' +
              "Full case study" +
              '<span aria-hidden="true">&rarr;</span>' +
              '<span class="cs-sr"> about ' + esc(cs.name) + "</span>" +
            "</button>" +
          "</article>" +
        "</li>"
      );
    }).join("");
  }

  /* ---------------------------------------------------------------- modal -- */
  function renderModal(i) {
    var cs = CASE_STUDIES[i];
    var m = cs.modal || {};
    var html = "";

    dialog.style.setProperty("--cs-a", cs.accent);
    dialog.style.setProperty("--cs-b", cs.accent2 || cs.accent);

    html +=
      '<div class="cs-modal-person">' + avatarHTML(cs) +
        "<div>" +
          '<p class="cs-modal-name">' + esc(m.name || cs.name) + "</p>" +
          '<p class="cs-cat">' + esc(cs.category) + "</p>" +
        "</div>" +
      "</div>";

    html += '<h2 class="cs-headline" id="cs-headline">' +
      esc(m.headline || cs.stat + ": " + cs.name) + "</h2>";

    if (m.stats && m.stats.length) {
      html += '<ul class="cs-stats">' + m.stats.map(function (s) {
        return '<li class="cs-tile"><span class="cs-tile-v">' + esc(s.value) +
          '</span><span class="cs-tile-l">' + esc(s.label) + "</span></li>";
      }).join("") + "</ul>";
    }

    if (m.quote && m.quote.text) {
      html += '<blockquote class="cs-quote">&ldquo;' + esc(m.quote.text) +
        "&rdquo;" +
        (m.quote.author ? "<footer>" + esc(m.quote.author) + "</footer>" : "") +
        "</blockquote>";
    }

    if (m.video) {
      html += '<div class="cs-video"><iframe src="' + esc(m.video) +
        '" title="' + esc(cs.name) + ' case study video" loading="lazy" ' +
        'allow="autoplay; fullscreen; picture-in-picture" ' +
        "allowfullscreen></iframe></div>";
    }

    var secs = (m.sections || []).filter(function (s) {
      return s && s.html && s.html.trim();
    });

    if (secs.length) {
      html += '<div class="cs-body">' + secs.map(function (s) {
        return '<div class="cs-sec"><p class="cs-sec-label">' + esc(s.label) +
          "</p>" + s.html + "</div>";
      }).join("") + "</div>";
    }

    if (m.cta && m.cta.text) {
      html += '<a class="cs-cta" href="' + esc(m.cta.href || "#") + '">' +
        esc(m.cta.text) + "</a>";
    }

    if (m.disclaimer) {
      html += '<p class="cs-disclaimer">' + esc(m.disclaimer) + "</p>";
    }

    if (CONFIG.showCount && CASE_STUDIES.length > 1) {
      html += '<p class="cs-count">Case study ' + (i + 1) + " of " +
        CASE_STUDIES.length + "</p>";
    }

    inner.innerHTML = html;
    current = i;

    var multiple = CASE_STUDIES.length > 1;
    prevBtn.hidden = !multiple;
    nextBtn.hidden = !multiple;

    if (CONFIG.deepLink && cs.id) {
      try {
        history.replaceState(null, "", "#case=" + cs.id);
      } catch (e) { /* file:// or blocked history, harmless */ }
    }
  }

  function lockScroll() {
    if (scrollLocked) return;
    var bar = window.innerWidth - document.documentElement.clientWidth;
    document.documentElement.style.overflow = "hidden";
    if (bar > 0) document.body.style.paddingRight = bar + "px";
    scrollLocked = true;
  }

  function unlockScroll() {
    if (!scrollLocked) return;
    document.documentElement.style.overflow = "";
    document.body.style.paddingRight = "";
    scrollLocked = false;
  }

  function open(i) {
    if (i < 0 || i >= CASE_STUDIES.length) return;
    lastFocus = document.activeElement;
    renderModal(i);
    modal.hidden = false;
    modal.classList.add("is-open");
    lockScroll();
    dialog.scrollTop = 0;
    dialog.focus();
  }

  function close() {
    if (!modal.classList.contains("is-open")) return;
    modal.classList.remove("is-open");
    modal.hidden = true;
    inner.innerHTML = ""; // kills any playing iframe
    unlockScroll();
    current = -1;

    if (CONFIG.deepLink && /#case=/.test(location.hash)) {
      try {
        history.replaceState(null, "", location.pathname + location.search);
      } catch (e) { /* noop */ }
    }

    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  function step(delta) {
    if (current < 0) return;
    var n = CASE_STUDIES.length;
    var i = ((current + delta) % n + n) % n;
    renderModal(i);
    dialog.scrollTop = 0;
    dialog.focus();
  }

  /* ---------------------------------------------------------------- events -- */
  grid.addEventListener("click", function (e) {
    var card = e.target.closest ? e.target.closest("[data-cs-index]") : null;
    if (!card) return;
    // let real links inside a card behave normally
    if (e.target.closest("a")) return;
    open(Number(card.getAttribute("data-cs-index")));
  });

  modal.addEventListener("click", function (e) {
    if (e.target.closest("[data-cs-close]")) close();
  });

  prevBtn.addEventListener("click", function () { step(-1); });
  nextBtn.addEventListener("click", function () { step(1); });

  document.addEventListener("keydown", function (e) {
    if (!modal.classList.contains("is-open")) return;

    if (e.key === "Escape") {
      close();
      return;
    }

    if (CONFIG.arrowKeys && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) {
      if (e.key === "ArrowLeft") { step(-1); return; }
      if (e.key === "ArrowRight") { step(1); return; }
    }

    if (e.key !== "Tab") return;

    // focus trap
    var f = dialog.querySelectorAll(
      'a[href], button:not([disabled]):not([hidden]), iframe, [tabindex]:not([tabindex="-1"])'
    );
    var list = Array.prototype.filter.call(f, function (el) {
      return el.offsetParent !== null || el === dialog;
    });
    if (!list.length) return;

    var first = list[0];
    var last = list[list.length - 1];

    if (e.shiftKey && (document.activeElement === first || document.activeElement === dialog)) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  });

  /* ------------------------------------------------------------------ boot -- */
  renderCards();

  // Move the modal to <body> so GHL wrappers with overflow/transform can't
  // clip it or trap it behind other page elements.
  if (modal.parentNode !== document.body) document.body.appendChild(modal);

  if (CONFIG.deepLink) {
    var match = /#case=([\w-]+)/.exec(location.hash);
    if (match) {
      var idx = CASE_STUDIES.map(function (c) { return c.id; }).indexOf(match[1]);
      if (idx > -1) open(idx);
    }
  }
})();
</script>
