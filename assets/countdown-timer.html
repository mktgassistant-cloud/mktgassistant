<!-- ============================================================
     LAUNCH COUNTDOWN — hours : minutes : seconds
     Paste this whole block into a GHL "Custom HTML/Javascript" element.

     Set MODE below to one of:
       "fixed"   – one hard close date for everyone   (this launch)
       "weekly"  – auto-rolls to the next weekday+time (evergreen, zero edits)
       "rolling" – per-visitor window from their first view

     Deadlines are anchored to a real timezone, so every visitor sees the
     same close time no matter where they are or what their clock says.
     ============================================================ -->

<div class="rpc" role="timer" aria-label="Time remaining until this offer closes">
  <div class="rpc__clock" data-rpc-clock>
    <div class="rpc__unit">
      <span class="rpc__num" data-rpc-hours>00</span>
      <span class="rpc__label">Hours</span>
    </div>
    <span class="rpc__sep" aria-hidden="true">:</span>
    <div class="rpc__unit">
      <span class="rpc__num" data-rpc-minutes>00</span>
      <span class="rpc__label">Minutes</span>
    </div>
    <span class="rpc__sep" aria-hidden="true">:</span>
    <div class="rpc__unit">
      <span class="rpc__num" data-rpc-seconds>00</span>
      <span class="rpc__label">Seconds</span>
    </div>
  </div>
  <div class="rpc__expired" data-rpc-expired hidden>This replay has expired.</div>
</div>

<style>
  .rpc {
    /* --- EDIT THESE THREE LINES TO RESTYLE --- */
    --rpc-text: #ffffff;      /* digit color (use #111 on a light page) */
    --rpc-accent: #ff4d4d;    /* separator + expired-message color */
    --rpc-label: #9aa0aa;     /* small caption color */

    text-align: center;
    font-family: inherit;
    line-height: 1;
  }
  /* An author `display` rule beats the [hidden] attribute, so restore it here.
     Without this the clock stays on screen after it expires. */
  .rpc [hidden] { display: none !important; }
  .rpc__clock {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: clamp(8px, 2vw, 20px);
  }
  .rpc__unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    min-width: clamp(56px, 12vw, 104px);
  }
  .rpc__num {
    font-size: clamp(2.6rem, 9vw, 5.2rem);
    font-weight: 800;
    color: var(--rpc-text);
    /* keeps the digits from jiggling as the numbers change */
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
  }
  .rpc__label {
    font-size: clamp(0.65rem, 1.6vw, 0.85rem);
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--rpc-label);
  }
  .rpc__sep {
    font-size: clamp(2rem, 7vw, 4rem);
    font-weight: 800;
    color: var(--rpc-accent);
    /* nudge the colon up so it optically centers on the digits */
    line-height: 1.15;
  }
  .rpc__expired {
    font-size: clamp(1.3rem, 4vw, 2rem);
    font-weight: 800;
    color: var(--rpc-accent);
  }
</style>

<script id="rpc-code">
window.__rpcRan = true;
(function () {
  var CONFIG = {
    /* ===== 1. PICK YOUR MODE ===== */
    mode: "fixed",

    /* ===== 2. CONFIGURE THAT MODE ===== */

    // "fixed": ONE close for everyone. Every visitor sees the same clock
    // ticking toward this moment. Change `date` each launch.
    fixed: {
      date: "2026-08-30",             // YYYY-MM-DD
      time: "00:00",                  // 24h clock — "00:00" = midnight Sat night
      zone: "America/New_York"        // your close is in ET
    },

    // "weekly": never edit again. Auto-targets the next matching weekday.
    weekly: {
      weekday: 0,                     // 0=Sun 1=Mon 2=Tue 3=Wed 4=Thu 5=Fri 6=Sat
      time: "23:59",
      zone: "America/New_York"
    },

    // "rolling": each visitor gets their own window, kept across refreshes.
    rolling: {
      hours: 32,
      storageKey: "replay_deadline_v1"   // bump v1 to restart everyone's clock
    },

    /* ===== 3. OPTIONAL DISPLAY CAP =====
       0 = off, so the clock always shows the true time left and is always
       ticking. Set a number only if you publish the page well before the
       campaign starts and don't want early visitors seeing a bigger number. */
    maxHours: 0,

    /* ===== 4. WHAT HAPPENS AT ZERO ===== */
    expiredText: "This replay has expired.",
    redirectUrl: ""                   // e.g. "https://yoursite.com/offer-closed"
  };

  /* ---------- timezone helpers ----------
     A visitor in Tokyo and a visitor in LA must see the same close time, so
     the deadline is built from wall-clock time in YOUR zone, not theirs. */

  // How far the named zone sits from UTC at a given instant (handles DST).
  function zoneOffsetMs(ts, zone) {
    var dtf = new Intl.DateTimeFormat("en-US", {
      timeZone: zone, hour12: false,
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", second: "2-digit"
    });
    var p = {};
    dtf.formatToParts(new Date(ts)).forEach(function (part) { p[part.type] = part.value; });
    // Some engines render midnight as hour "24"; normalize it.
    var asUTC = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second);
    return asUTC - ts;
  }

  // Wall-clock time in `zone` -> real UTC timestamp. Resolved twice so a
  // deadline that lands near a DST switch settles on the correct offset.
  function zonedTimeToTs(y, mo, d, h, mi, zone) {
    var target = Date.UTC(y, mo - 1, d, h, mi, 0);
    var ts = target;
    for (var i = 0; i < 2; i++) ts = target - zoneOffsetMs(ts, zone);
    return ts;
  }

  // Today's calendar date as seen in `zone`.
  function todayInZone(zone) {
    var p = {};
    new Intl.DateTimeFormat("en-US", {
      timeZone: zone, year: "numeric", month: "2-digit", day: "2-digit"
    }).formatToParts(new Date()).forEach(function (part) { p[part.type] = part.value; });
    return { y: +p.year, mo: +p.month, d: +p.day };
  }

  function parseHM(str) {
    var bits = String(str).split(":");
    return { h: +bits[0] || 0, mi: +bits[1] || 0 };
  }

  /* ---------- deadline resolution ---------- */

  function fixedDeadline(cfg) {
    var ymd = String(cfg.date).split("-");
    var hm = parseHM(cfg.time);
    return zonedTimeToTs(+ymd[0], +ymd[1], +ymd[2], hm.h, hm.mi, cfg.zone);
  }

  function weeklyDeadline(cfg) {
    var today = todayInZone(cfg.zone);
    var hm = parseHM(cfg.time);
    var now = Date.now();
    for (var add = 0; add <= 14; add++) {
      // Date.UTC rolls month/year over for us, so d + add is always safe.
      var wall = new Date(Date.UTC(today.y, today.mo - 1, today.d + add));
      if (wall.getUTCDay() !== cfg.weekday) continue;
      var ts = zonedTimeToTs(
        wall.getUTCFullYear(), wall.getUTCMonth() + 1, wall.getUTCDate(),
        hm.h, hm.mi, cfg.zone
      );
      if (ts > now) return ts;
    }
    return now; // unreachable in practice
  }

  // localStorage throws in some private-browsing modes, so guard every access.
  function readStored(key) {
    try { return parseInt(window.localStorage.getItem(key), 10) || 0; }
    catch (e) { return 0; }
  }
  function writeStored(key, ts) {
    try { window.localStorage.setItem(key, String(ts)); }
    catch (e) { /* countdown still works, it just resets on refresh */ }
  }

  function urlParam(name) {
    return new URLSearchParams(window.location.search).get(name);
  }

  // Accepts an ISO date, epoch milliseconds, or epoch seconds.
  function parseTs(raw) {
    if (!raw) return 0;
    var num = Number(raw);
    if (isNaN(num)) {
      var parsed = Date.parse(raw);
      return isNaN(parsed) ? 0 : parsed;
    }
    // Epoch seconds are ~1e9; milliseconds are ~1e12.
    return num < 1e11 ? num * 1000 : num;
  }

  function rollingDeadline(cfg) {
    // A deadline carried in the link is the contact's real one, so it wins and
    // gets saved — that way later visits without the link keep the same clock.
    var exp = parseTs(urlParam("exp"));
    var start = parseTs(urlParam("start"));
    var fromUrl = exp || (start ? start + cfg.hours * 3600000 : 0);
    if (fromUrl) {
      if (readStored(cfg.storageKey) !== fromUrl) writeStored(cfg.storageKey, fromUrl);
      return fromUrl;
    }

    var stored = readStored(cfg.storageKey);
    if (stored) return stored;

    var fresh = Date.now() + cfg.hours * 3600000;
    writeStored(cfg.storageKey, fresh);
    return fresh;
  }

  function resolveDeadline() {
    if (CONFIG.mode === "rolling") return rollingDeadline(CONFIG.rolling);

    // For a shared close date, ?exp= is a temporary override (handy for
    // testing the expired state) and is deliberately not persisted. ?start=
    // is ignored here — it only means something for a per-visitor window.
    var fromUrl = parseTs(urlParam("exp"));
    if (fromUrl) return fromUrl;
    if (CONFIG.mode === "weekly") return weeklyDeadline(CONFIG.weekly);
    return fixedDeadline(CONFIG.fixed);
  }

  /* ---------- the clock ---------- */

  function pad(n) { return n < 10 ? "0" + n : String(n); }

  function start(root) {
    root.setAttribute("data-rpc-started", "1");

    var clockEl   = root.querySelector("[data-rpc-clock]");
    var expiredEl = root.querySelector("[data-rpc-expired]");
    var hoursEl   = root.querySelector("[data-rpc-hours]");
    var minutesEl = root.querySelector("[data-rpc-minutes]");
    var secondsEl = root.querySelector("[data-rpc-seconds]");
    if (!hoursEl || !minutesEl || !secondsEl) return;

    var deadline = resolveDeadline();
    var maxMs = (CONFIG.maxHours || 0) * 3600000;
    var timerId = null;

    function showExpired() {
      if (timerId) { clearInterval(timerId); timerId = null; }
      if (clockEl) clockEl.hidden = true;
      if (expiredEl) {
        expiredEl.textContent = CONFIG.expiredText;
        expiredEl.hidden = false;
      }
      if (CONFIG.redirectUrl) window.location.href = CONFIG.redirectUrl;
    }

    function tick() {
      var remaining = deadline - Date.now();
      if (remaining <= 0) { showExpired(); return; }
      // Hold at the cap until the real close comes inside the window.
      if (maxMs && remaining > maxMs) remaining = maxMs;

      var totalSeconds = Math.floor(remaining / 1000);
      hoursEl.textContent   = pad(Math.floor(totalSeconds / 3600));
      minutesEl.textContent = pad(Math.floor(totalSeconds / 60) % 60);
      secondsEl.textContent = pad(totalSeconds % 60);
    }

    tick();
    // Recomputed from an absolute timestamp every 250ms, so it never drifts and
    // catches up instantly when a throttled background tab returns to focus.
    timerId = setInterval(tick, 250);
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) tick();
    });
  }

  /* ---------- boot ----------
     Page builders sometimes run custom JS before the markup it belongs to
     exists, so don't give up if the element isn't there on the first try. */

  function boot() {
    var pending = document.querySelector(".rpc:not([data-rpc-started])");
    if (pending) { start(pending); return true; }
    // No unstarted timer: either we already booted, or markup isn't parsed yet.
    return document.querySelectorAll(".rpc").length > 0;
  }

  if (!boot()) {
    document.addEventListener("DOMContentLoaded", boot);
    var tries = 0;
    var poll = setInterval(function () {
      if (boot() || ++tries > 40) clearInterval(poll);   // stop after ~10s
    }, 250);
  }
})();
</script>

<!-- Some page builders (GHL included) insert this block using innerHTML, and
     browsers will not execute a <script> tag added that way — styles apply but
     the clock sits at 00:00:00. An inline handler still fires, so if the script
     above never ran, re-inject it as a real script element, which does run. -->
<img src="data:," alt="" aria-hidden="true" width="0" height="0"
     style="position:absolute;width:0;height:0;opacity:0;pointer-events:none"
     onerror="if(!window.__rpcRan){var c=document.getElementById('rpc-code');if(c){var s=document.createElement('script');s.text=c.textContent;document.head.appendChild(s);}}">

<!-- ============================================================
     HOW THE DEADLINE BEHAVES

     In "fixed" mode (the default) there is ONE close for everyone. The
     clock is computed from the close date on every tick, so:

       - every visitor sees the same number, counting down together
       - refreshing, switching phones, or clearing site data changes nothing
       - nothing is stored in the browser; there is no per-person clock
       - it can't drift, and it survives the tab being backgrounded

     Each launch, change only `fixed.date` (and `time` if the hour moves).

     "weekly" does the same thing but retargets the next matching weekday
     automatically, so a recurring launch needs no edits at all.

     "rolling" gives each visitor their own window from their first view,
     saved in their browser. Link with ?start={{contact.date_created}} to
     tie that window to the contact rather than the browser.
     ============================================================ -->
