name: Daily analyst job scan

on:
  schedule:
    # 12:00 UTC, Monday-Friday (morning US time)
    - cron: "0 12 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        run: python -m agent.run

      - name: Commit results
        run: |
          git config user.name "analyst-outreach-agent"
          git config user.email "actions@github.com"
          git add data outreach
          if git diff --cached --quiet; then
            echo "No new roles today, nothing to commit."
          else
            git commit -m "Daily scan: $(date -u +%F)"
            git push
          fi
