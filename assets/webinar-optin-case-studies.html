  function esc(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function initials(name) {
    return String(name || "")
      .replace(/\(.*?\)/g, "")
      .trim()
      .split(/\s+/)
      .slice(0, 2)
      .map(function (w) { return w.charAt(0).toUpperCase(); })
      .join("");
  }

  function avatarHTML(cs) {
    if (cs.avatar) {
      return '<span class="cs-avatar"><img src="' + esc(cs.avatar) +
        '" alt="" loading="lazy" decoding="async"></span>';
    }
    return '<span class="cs-avatar" aria-hidden="true">' +
      esc(initials(cs.name)) + "</span>";
  }

  function addScript(src, isModule) {
    if (document.querySelector(
      'script[data-cs-src="' + src + '"], script[src="' + src + '"]'
    )) return;
    var el = document.createElement("script");
    el.src = src;
    el.async = true;
    el.setAttribute("data-cs-src", src);
    if (isModule) el.type = "module";
    document.head.appendChild(el);
  }

  function ensureWistia(id) {
    addScript("https://fast.wistia.com/player.js", false);
    addScript("https://fast.wistia.com/embed/" + id + ".js", true);
  }

  function arrows(safeHTML) {
    return safeHTML.replace(/→/g, '<span class="cs-arrow">→</span>');
  }

  function statHTML(safeHTML) {
    return arrows(safeHTML).replace(
      /\(([^)]*)\)/g,
      '<span class="cs-qual">($1)</span>'
    );
  }

  function quoteHTML(q, extraClass) {
    return '<blockquote class="cs-quote' + (extraClass ? " " + extraClass : "") +
      '">&ldquo;' + esc(q.text) + "&rdquo;" +
      (q.author ? "<footer>" + esc(q.author) + "</footer>" : "") +
      "</blockquote>";
  }

  /* ---------------------------------------------------------------- cards -- */
  function listFor(mount) {
    var raw = (mount.getAttribute("data-cs") || "").trim();
    if (!raw) return CASE_STUDIES.map(function (c, i) { return i; });

    var ids = CASE_STUDIES.map(function (c) { return c.id; });
    var out = [];

    raw.split(",").forEach(function (part) {
      var i = ids.indexOf(part.trim());
      if (i > -1 && out.indexOf(i) < 0) out.push(i);
    });

    return out;
  }

      var cs = CASE_STUDIES[i];
      var len = String(cs.stat).length;
      var longStat = len > 30 ? " is-xxlong"
        : len > 18 ? " is-xlong"
        : len > 11 ? " is-long" : "";
      if (!cs.statLabel) longStat += " is-solo";

      return (
        '<li>' +
          '<article class="cs-card" data-cs-index="' + i + '" ' +
            'role="button" tabindex="0" aria-haspopup="dialog" ' +
            'aria-label="Read ' + esc(cs.name) + '’s full story" ' +
            'style="--cs-a:' + esc(cs.accent) + ";--cs-b:" +
            esc(cs.accent2 || cs.accent) + '">' +
            '<div class="cs-person">' +
              avatarHTML(cs) +
              "<div>" +
                '<h3 class="cs-name">' + esc(cs.name) + "</h3>" +
                '<p class="cs-cat">' + esc(cs.category) + "</p>" +
              "</div>" +
            "</div>" +
            '<p class="cs-stat' + longStat + '">' + statHTML(esc(cs.stat)) +
              "</p>" +
            (cs.statLabel
              ? '<p class="cs-statlab">' + esc(cs.statLabel) + "</p>"
              : "") +
            '<p class="cs-sum">' + esc(cs.summary) + "</p>" +
          "</article>" +
        "</li>"
      );
    }).join("") + "</ul>";
  }

  function ctaHref(cta, cs) {
    var href = cta.href || CONFIG.ctaHref || "#";
    if (!CONFIG.ctaUTM || href.charAt(0) === "#" || !cs.id) return href;

    return href + (href.indexOf("?") > -1 ? "&" : "?") +
      "utm_source=website&utm_medium=case-study" +
      "&utm_campaign=student-stories&utm_content=" +
      encodeURIComponent(cs.id);
  }

  /* ---------------------------------------------------------------- modal -- */
  function renderModal(i) {
    var cs = CASE_STUDIES[i];
    var m = cs.modal || {};
    var html = "";

    dialog.style.setProperty("--cs-a", cs.accent);
    dialog.style.setProperty("--cs-b", cs.accent2 || cs.accent);

    html +=
      '<div class="cs-modal-person">' + avatarHTML(cs) +
        "<div>" +
          '<p class="cs-modal-name">' + esc(m.name || cs.name) + "</p>" +
          '<p class="cs-cat">' + esc(m.category || cs.category) + "</p>" +
          (cs.linkedin
            ? '<a class="cs-verify" href="' + esc(cs.linkedin) +
              '" target="_blank" rel="noopener noreferrer">' +
              "Verify on LinkedIn ↗</a>"
            : "") +
        "</div>" +
      "</div>";

    html += '<h2 class="cs-headline" id="cs-headline">' +
      arrows(esc(m.headline || cs.stat + ": " + cs.name)) + "</h2>";

    if (m.subhead) {
      html += '<p class="cs-subhead">' + esc(m.subhead) + "</p>";
    }

    if (m.stats && m.stats.length) {
      html += '<ul class="cs-stats">' + m.stats.map(function (s) {
        return '<li class="cs-tile"><span class="cs-tile-v">' +
          arrows(esc(s.value)) + '</span><span class="cs-tile-l">' +
          esc(s.label) + "</span></li>";
      }).join("") + "</ul>";
    }

    if (m.quote && m.quote.text) html += quoteHTML(m.quote, "");

    var secs = (m.sections || []).filter(function (s) {
      return s && s.html && s.html.trim();
    });

    if (secs.length) {
      html += '<div class="cs-body">' + secs.map(function (s) {
        return '<div class="cs-sec"><p class="cs-sec-label">' + esc(s.label) +
          "</p>" + s.html + "</div>";
      }).join("") + "</div>";
    }

    if (m.closingQuote && m.closingQuote.text) {
      html += quoteHTML(m.closingQuote, "is-closing");
    }

    var imgs = (m.images || []).filter(function (im) { return im && im.src; });

    if (imgs.length) {
      html += '<div class="cs-proof">' + imgs.map(function (im) {
        return "<figure><img src=\"" + esc(im.src) + '" alt="' +
          esc(im.alt || "") + '" loading="lazy" decoding="async">' +
          (im.caption ? "<figcaption>" + esc(im.caption) + "</figcaption>" : "") +
          "</figure>";
      }).join("") + "</div>";
    }

    if (m.wistia) {
      ensureWistia(m.wistia);
      html += '<div class="cs-video is-wistia">' +
        '<wistia-player media-id="' + esc(m.wistia) +
        '" aspect="1.7777777777777777" style="--cs-swatch:url(' +
        "'https://fast.wistia.com/embed/medias/" + esc(m.wistia) +
        "/swatch')\"></wistia-player></div>";
    } else if (m.video) {
      html += '<div class="cs-video"><iframe src="' + esc(m.video) +
        '" title="' + esc(cs.name) + ' case study video" loading="lazy" ' +
        'allow="autoplay; fullscreen; picture-in-picture" ' +
        "allowfullscreen></iframe></div>";
    }

    if (m.cta && m.cta.text) {
      html += '<a class="cs-cta" href="' + esc(ctaHref(m.cta, cs)) + '">' +
        esc(m.cta.text) + "</a>";
    }

    if (m.disclaimer) {
      html += '<p class="cs-disclaimer">' + esc(m.disclaimer) + "</p>";
    }

    inner.innerHTML = html;
    current = i;

    var multiple = active.length > 1;
    prevBtn.hidden = !multiple;
    nextBtn.hidden = !multiple;

    if (CONFIG.deepLink && cs.id) {
      try {
        history.replaceState(null, "", "#case=" + cs.id);
      } catch (e) { /* file:// or blocked history, harmless */ }
    }
  }

  function lockScroll() {
    if (scrollLocked) return;
    var bar = window.innerWidth - document.documentElement.clientWidth;
    document.documentElement.style.overflow = "hidden";
    if (bar > 0) document.body.style.paddingRight = bar + "px";
    scrollLocked = true;
  }

  function unlockScroll() {
    if (!scrollLocked) return;
    document.documentElement.style.overflow = "";
    document.body.style.paddingRight = "";
    scrollLocked = false;
  }

  function open(i, list) {
    if (i < 0 || i >= CASE_STUDIES.length) return;
    active = list && list.length ? list : [i];
    lastFocus = document.activeElement;
    renderModal(i);
    modal.hidden = false;
    modal.classList.add("is-open");
    lockScroll();
    dialog.scrollTop = 0;
    dialog.focus();
  }

  function close() {
    if (!modal.classList.contains("is-open")) return;
    modal.classList.remove("is-open");
    modal.hidden = true;
    inner.innerHTML = "";
    unlockScroll();
    current = -1;

    if (CONFIG.deepLink && /#case=/.test(location.hash)) {
      try {
        history.replaceState(null, "", location.pathname + location.search);
      } catch (e) { /* noop */ }
    }

    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  function step(delta) {
    if (current < 0 || !active.length) return;
    var at = active.indexOf(current);
    if (at < 0) return;
    var n = active.length;
    var i = active[((at + delta) % n + n) % n];
    renderModal(i);
    dialog.scrollTop = 0;
    dialog.focus();
  }

  function openFromCard(card) {
    var mount = card.closest(".cs-mount");
    open(Number(card.getAttribute("data-cs-index")),
      mount ? listFor(mount) : null);
  }

  /* ---------------------------------------------------------------- events -- */
  document.addEventListener("click", function (e) {
    if (!e.target.closest) return;
    var card = e.target.closest("[data-cs-index]");
    if (!card) return;
    if (e.target.closest("a")) return;
    openFromCard(card);
  });

  /* Enter / Space on a focused card opens it, the way the old link button
     did for keyboard users */
  document.addEventListener("keydown", function (e) {
    if (modal.classList.contains("is-open")) return;
    if (e.key !== "Enter" && e.key !== " ") return;
    var card = e.target.closest && e.target.closest("[data-cs-index]");
    if (!card || card !== e.target) return;
    e.preventDefault();
    openFromCard(card);
  });

  modal.addEventListener("click", function (e) {
    if (e.target.closest("[data-cs-close]")) close();
  });

  prevBtn.addEventListener("click", function () { step(-1); });
  nextBtn.addEventListener("click", function () { step(1); });

  document.addEventListener("keydown", function (e) {
    if (!modal.classList.contains("is-open")) return;

    if (e.key === "Escape") {
      close();
      return;
    }

    if (CONFIG.arrowKeys && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) {
      if (e.key === "ArrowLeft") { step(-1); return; }
      if (e.key === "ArrowRight") { step(1); return; }
    }

    if (e.key !== "Tab") return;

    var f = dialog.querySelectorAll(
      'a[href], button:not([disabled]):not([hidden]), iframe, [tabindex]:not([tabindex="-1"])'
    );
    var list = Array.prototype.filter.call(f, function (el) {
      return el.offsetParent !== null || el === dialog;
    });
    if (!list.length) return;

    var first = list[0];
    var last = list[list.length - 1];

    if (e.shiftKey && (document.activeElement === first || document.activeElement === dialog)) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  });

  /* ------------------------------------------------------------------ boot -- */
  if (modal.parentNode !== document.body) document.body.appendChild(modal);

  function scan() {
    var found = [].slice.call(document.querySelectorAll(".cs-mount"));
    var lists = [];

    found.forEach(function (mount) {
      var list = listFor(mount);
      lists.push(list);
      if (mount.getAttribute("data-cs-ready")) return;
      renderCards(mount, list);
      mount.setAttribute("data-cs-ready", "1");
    });

    return lists;
  }

  function deepLink(lists) {
    if (!CONFIG.deepLink || current > -1) return;

    var match = /#case=([\w-]+)/.exec(location.hash);
    if (!match) return;

    var idx = CASE_STUDIES.map(function (c) { return c.id; }).indexOf(match[1]);
    if (idx < 0) return;

    var owner = null;
    lists.forEach(function (l) {
      if (!owner && l.indexOf(idx) > -1) owner = l;
    });

    open(idx, owner);
  }

  function boot() { deepLink(scan()); }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }

  window.addEventListener("load", function () { deepLink(scan()); });
})();
</script>
