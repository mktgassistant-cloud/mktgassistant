<!--
  ============================================================================
  FIRST 6 CASE STUDY CARDS, ready to paste into ONE GHL element
  ============================================================================
  This is the full engine plus the mount for cards 1 to 6, so it drops
  straight into the Custom HTML/Javascript element where you want those cards
  and renders them right there. Nothing to assemble, nothing to edit.

  PASTE THIS FILE ONCE ON THE PAGE. For every other place you want cards,
  paste ONLY a mount line, because the engine is already loaded:

    <div class="cs-mount" data-cs="ronnie,thomas,hakeem"></div>
    <div class="cs-mount" data-cs="rachel,will,elleni"></div>
    <div class="cs-mount" data-cs="amanda,robby,tanya"></div>

  A mount can sit anywhere on the page, above or below this element.
  All 15 ids, in strength order:
    larita caitlin katherine jose jacinda shantel ronnie thomas hakeem
    rachel will elleni amanda robby tanya
  ============================================================================
-->

<!-- Cards 1 to 6. One mount, so they lay out as 2 rows of 3 AND the modal
     arrows walk all 6. Split it into two mounts only if you want the rows in
     different places on the page. -->
<div class="cs-mount"
  data-cs="larita,caitlin,katherine,jose,jacinda,shantel"></div>

<!--
  ============================================================================
  CASE STUDY CARDS + MODAL: paste-into-GoHighLevel block
  ============================================================================
  HOW TO USE
    1. Paste this ENTIRE file ONCE. Either a "Custom Code" (or "Code")
       element at the bottom of the page, or
       Settings > Tracking Code > Footer. Once, not once per group.
    2. Then drop a mount wherever you want cards to appear. A mount is one
       line, and you can have as many as you like:

         <div class="cs-mount" data-cs="larita,caitlin,katherine"></div>

       data-cs is a comma separated list of ids, shown in the order you
       write them. Leave data-cs off and that mount renders all of them.
       A mount can sit above or below this block, it makes no difference.
    3. Edit only the CASE_STUDIES array below. Everything (cards + modals) is
       generated from it, so a card and its detail view can never drift apart.
    4. Search for "TODO" to find every spot that still needs your copy,
       avatar URL, quote, or video.

  GROUPS AND THE ARROWS
    The modal arrows walk the group you clicked into, not all 15. Click a
    card in a mount of 3 and the arrows cycle those 3. A mount of 1 hides
    the arrows entirely.

  WHAT TO EDIT PER CASE STUDY
    id        - short slug, used for the #case=<id> deep link. Keep unique.
    name      - name shown on the card and in the modal header
    category  - small coral line under the name
    avatar    - square image URL (use the GHL media library). Leave "" and the
                card falls back to the person's initials.
    accent    - main color: the big number + left half of the top bar
    accent2   - right half of the top bar gradient (omit to reuse accent)
    stat      - the big headline line on the card. Use \u2192 for the arrow,
                e.g. "Laid Off \u2192 $90K Fully-Remote Job in 30 Days". Font size
                steps down automatically as it gets longer.
    statLabel - optional small grey line under it. Omit to hide.
    summary   - 2-3 sentence card blurb
    modal.name     - optional. Header name for the modal only, when it should
                     differ from the card (e.g. card "Ronnie", modal
                     "Ronnie, eSimplicity"). Omit to reuse name.
    modal.category - optional. Same idea for the small line under the name.
    modal.headline - bold line at the top of the modal
    modal.subhead  - optional lead line under the headline. Omit to hide.
    modal.stats    - 2 or 4 stat tiles: { value, label }
    modal.quote    - { text, author } shown ABOVE the write-up. Omit to hide.
    modal.closingQuote - { text, author } shown BELOW the write-up, just above
                     the CTA. Use instead of modal.quote when the testimonial
                     is the closer. Both can be set.
    modal.images   - optional proof screenshots shown just above the video:
                     [{ src, alt, caption }]. Upload to the GHL media library
                     and paste the URLs. An entry with an empty src is skipped.
    modal.wistia   - Wistia media ID only, e.g. "e2jdcz4o5w" (the part after
                     /medias/ in the embed snippet). The player scripts load
                     on first open. Omit to hide the player.
    modal.video    - alternative to modal.wistia for any other host: a full
                     EMBED url, e.g. https://www.youtube.com/embed/XXXX.
                     Ignored when modal.wistia is set.
    modal.sections - [{ label, html }]. label renders as the small coral
                     all-caps heading. Empty html is skipped automatically.
                     Inside html, use <p class="cs-pull"> for a short quote
                     set into the body copy.
    modal.cta      - { text, href }. Button at the bottom. Omit to hide.
    modal.disclaimer - small grey print under the CTA. Omit to hide.

  COPY RULES
    * No em dashes anywhere.
    * Numerals, not words: 30 days, not thirty days. 8 to 10, not eight to ten.
    * headline / subhead / stat / summary / quote text are escaped, so type
      real characters there (\u2019 \u201c \u2192), NOT HTML entities. Inside
      modal.sections html it is the reverse: use &rsquo; &ldquo; &rarr;.
    * Rows are 3 cards across on desktop, 2 on tablet, 1 on phone.

  NOTES
    * All CSS is namespaced under .cs-wrap / .cs-* so it cannot collide with
      GHL's own styles, and the JS lives in one IIFE (no globals leaked).
    * On load the modal is moved to <body> so GHL sections with overflow or
      transforms can't break position:fixed. This is the #1 reason DIY GHL
      modals appear clipped or behind other elements.
    * Fully keyboard accessible: Tab reaches each card's button, Esc closes,
      focus is trapped in the dialog and returned to the card on close.
    * Arrow keys / the ‹ › buttons move between case studies inside the modal.
  ============================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
>

<style>
  /* Design tokens live on BOTH roots: the modal is relocated to <body> at
     runtime, so it can't inherit variables from .cs-wrap. */
  .cs-wrap,
  .cs-modal {
    /* ---- DIM brand palette, taken from datacareerblueprint.com ----------
       --cs-blue   #0038FF  primary (the GET INSTANT ACCESS button)
       --cs-coral  #FF6240  accent  (labels, links)
       page background is #000321, so the surfaces below sit just above it */
    --cs-font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif;

    --cs-blue: #0038ff;
    --cs-blue-lift: #4d7bff; /* blue that stays legible as text on navy */
    --cs-coral: #ff6240;
    --cs-coral-soft: #ff8163;

    --cs-card-bg: #0d1336;
    --cs-card-bg-2: #0a0e29; /* bottom of the card's vertical gradient */
    --cs-modal-bg: #080c26;
    --cs-tile-bg: #131a3c;
    --cs-line: #232c5e;
    --cs-text: #f6f6ff;
    --cs-body: #c9d8e0;
    --cs-muted: #8893a8;

    --cs-gap: 18px;
    --cs-max: 1180px;
    --cs-radius: 16px;
  }

  .cs-wrap {
    --cs-cols: 3;

    display: block;
    width: 100%;
    max-width: 100%;
    margin: 0 auto;
    padding: 8px 0;
    color: var(--cs-text);
    font-family: var(--cs-font, inherit);
    -webkit-font-smoothing: antialiased;
  }

  .cs-wrap *,
  .cs-wrap *::before,
  .cs-wrap *::after {
    box-sizing: border-box;
  }

  /* ---------------------------------------------------------------- grid -- */
  .cs-grid {
    display: grid;
    grid-template-columns: repeat(var(--cs-cols), minmax(0, 1fr));
    gap: var(--cs-gap);
    width: 100%;
    max-width: var(--cs-max);
    margin: 0 auto;
    padding: 0;
    list-style: none;
  }

  /* Rows are 3 across. With 1 or 2 case studies the JS adds .cs-n1 / .cs-n2 so
     the set stays centered at a natural card width instead of stretching across
     a 3-column track. The responsive overrides at the bottom of this stylesheet
     use the same specificity and come later, so they still win. */
  .cs-wrap.cs-n1 {
    --cs-cols: 1;
    --cs-max: 400px;
  }

  .cs-wrap.cs-n2 {
    --cs-cols: 2;
    --cs-max: 780px;
  }

  /* --------------------------------------------------------------- card -- */
  .cs-card {
    position: relative;
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 26px 22px 22px;
    overflow: hidden;
    text-align: left;
    background: linear-gradient(180deg, var(--cs-card-bg), var(--cs-card-bg-2));
    border: 1px solid var(--cs-line);
    border-radius: var(--cs-radius);
    cursor: pointer;
    transition: transform 0.22s ease, box-shadow 0.22s ease,
      border-color 0.22s ease;
  }

  /* two-tone accent bar across the top of every card */
  .cs-card::before {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    left: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--cs-a), var(--cs-b));
  }

  .cs-card:hover,
  .cs-card:focus-within {
    transform: translateY(-6px);
    border-color: color-mix(in srgb, var(--cs-a) 55%, var(--cs-line));
    box-shadow: 0 18px 44px rgba(0, 12, 60, 0.75),
      0 0 0 1px color-mix(in srgb, var(--cs-a) 22%, transparent);
  }

  .cs-person {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
  }

  .cs-avatar {
    display: flex;
    width: 46px;
    height: 46px;
    flex: 0 0 46px;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    color: var(--cs-blue-lift);
    background: #151d45;
    border: 2px solid color-mix(in srgb, var(--cs-a) 65%, #6f7cb0);
    border-radius: 50%;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .cs-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
  }

  .cs-name {
    margin: 0 0 3px;
    color: var(--cs-text);
    font-size: 16px;
    font-weight: 700;
    line-height: 1.2;
  }

  .cs-cat {
    margin: 0;
    color: var(--cs-muted);
    font-size: 12px;
    font-weight: 500;
    line-height: 1.35;
  }

  .cs-stat {
    margin: 0 0 6px;
    /* the raw brand blue is too dark to read on navy, so mix it toward white.
       The first declaration is the fallback where color-mix is unsupported. */
    color: var(--cs-a);
    color: color-mix(in srgb, var(--cs-a) 58%, #ffffff);
    font-size: 30px;
    font-weight: 800;
    line-height: 1.12;
    letter-spacing: -0.5px;
  }

  /* text headlines like "Laid Off to $90K Remote" need to step down so they
     don't wrap into three or four lines */
  .cs-stat.is-long {
    font-size: 24px;
  }

  .cs-stat.is-xlong {
    font-size: 21px;
    letter-spacing: -0.2px;
  }

  .cs-stat.is-xxlong {
    font-size: 19px;
    line-height: 1.25;
    letter-spacing: -0.1px;
  }

  /* the arrow is the whole point of a before/after line, so it gets the
     accent color instead of blending into the phrase */
  .cs-arrow {
    color: var(--cs-coral);
    padding: 0 3px;
    font-weight: 700;
  }

  .cs-tile-v .cs-arrow {
    padding: 0 2px;
  }

  /* a parenthetical in a card headline is a qualifier, not part of the claim,
     so it steps down in size and weight instead of competing with it */
  .cs-qual {
    display: inline-block;
    color: var(--cs-body);
    font-size: 0.74em;
    font-weight: 600;
    letter-spacing: 0;
  }

  /* statLabel is optional; without it the headline needs its own breathing
     room before the summary copy */
  .cs-stat.is-solo {
    margin-bottom: 18px;
  }

  .cs-statlab {
    margin: 0 0 16px;
    color: var(--cs-muted);
    font-size: 12.5px;
    line-height: 1.45;
  }

  .cs-sum {
    margin: 0 0 22px;
    color: var(--cs-body);
    font-size: 14px;
    line-height: 1.6;
  }

  .cs-more {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    align-self: flex-start;
    margin-top: auto;
    padding: 2px 0;
    color: var(--cs-coral-soft);
    background: none;
    border: 0;
    border-radius: 4px;
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  .cs-more span {
    transition: transform 0.2s ease;
  }

  .cs-card:hover .cs-more,
  .cs-more:hover {
    color: #ffa48f;
  }

  .cs-card:hover .cs-more span {
    transform: translateX(4px);
  }

  .cs-more:focus-visible,
  .cs-nav:focus-visible,
  .cs-close:focus-visible,
  .cs-cta:focus-visible {
    outline: 2px solid var(--cs-coral);
    outline-offset: 3px;
  }

  .cs-sr {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* -------------------------------------------------------------- modal -- */
  .cs-modal {
    position: fixed;
    z-index: 2147483000; /* above GHL headers, chat widgets and sticky bars */
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 28px 20px;
    font-family: var(--cs-font, inherit);
  }

  .cs-modal.is-open {
    display: flex;
  }

  .cs-modal *,
  .cs-modal *::before,
  .cs-modal *::after {
    box-sizing: border-box;
  }

  .cs-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 3, 33, 0.86);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    animation: cs-fade 0.2s ease both;
  }

  .cs-dialog {
    position: relative;
    z-index: 1;
    width: min(780px, 100%);
    max-height: min(88vh, 900px);
    padding: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    color: var(--cs-text);
    background: var(--cs-modal-bg);
    border: 1px solid var(--cs-line);
    border-radius: 20px;
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.7);
    animation: cs-rise 0.24s cubic-bezier(0.2, 0.8, 0.3, 1) both;
    scrollbar-width: thin;
  }

  .cs-dialog::before {
    content: "";
    position: sticky;
    top: 0;
    display: block;
    height: 4px;
    background: linear-gradient(90deg, var(--cs-a), var(--cs-b));
  }

  @keyframes cs-fade {
    from {
      opacity: 0;
    }
  }

  @keyframes cs-rise {
    from {
      opacity: 0;
      transform: translateY(18px) scale(0.985);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .cs-card,
    .cs-more span,
    .cs-overlay,
    .cs-dialog {
      transition: none;
      animation: none;
    }

    .cs-card:hover {
      transform: none;
    }
  }

  .cs-inner {
    padding: 56px 34px 34px;
  }

  /* zero-height sticky row: the controls float over the content and stay put
     while the dialog scrolls, without reserving layout space */
  .cs-topbar {
    position: sticky;
    top: 4px;
    z-index: 3;
    display: flex;
    align-items: flex-start;
    justify-content: flex-end;
    gap: 8px;
    height: 0;
    padding: 0 16px;
    pointer-events: none;
  }

  .cs-nav,
  .cs-close {
    margin-top: 14px;
    pointer-events: auto;
    display: flex;
    width: 36px;
    height: 36px;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    padding: 0;
    color: #c9d8e0;
    background: rgba(19, 26, 60, 0.94);
    border: 1px solid var(--cs-line);
    border-radius: 50%;
    font: inherit;
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
    transition: color 0.18s ease, background 0.18s ease;
  }

  .cs-close {
    font-size: 22px;
  }

  /* the .cs-nav display:flex above outranks the UA [hidden] rule, so the
     prev/next buttons need this to actually disappear for a single card */
  .cs-nav[hidden],
  .cs-close[hidden] {
    display: none;
  }

  /* scrim so body copy fades out under the sticky controls instead of
     colliding with them */
  .cs-topbar::before {
    content: "";
    position: absolute;
    top: -4px;
    right: 0;
    left: 0;
    height: 62px;
    background: linear-gradient(
      to bottom,
      var(--cs-modal-bg) 40%,
      rgba(8, 12, 38, 0)
    );
    pointer-events: none;
  }

  .cs-nav:hover,
  .cs-close:hover {
    color: #fff;
    background: #1e2650;
  }

  .cs-modal-person {
    display: flex;
    align-items: center;
    gap: 13px;
    margin: 0 0 22px;
  }

  .cs-modal-name {
    margin: 0 0 3px;
    font-size: 17px;
    font-weight: 700;
    line-height: 1.2;
  }

  /* the profile link is the whole verifiability argument, so it sits with the
     name rather than buried at the bottom */
  .cs-verify {
    display: inline-block;
    margin-top: 6px;
    color: var(--cs-blue-lift);
    color: color-mix(in srgb, var(--cs-a) 62%, #ffffff);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.2px;
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }

  .cs-verify:hover,
  .cs-verify:focus-visible {
    border-bottom-color: currentColor;
  }

  .cs-headline {
    margin: 0 0 22px;
    font-size: clamp(21px, 2.5vw, 27px);
    font-weight: 800;
    line-height: 1.3;
    letter-spacing: -0.4px;
  }

  /* lead line under the headline */
  .cs-subhead {
    margin: -8px 0 24px;
    color: var(--cs-body);
    font-size: 16.5px;
    line-height: 1.55;
  }

  .cs-stats {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin: 0 0 24px;
    padding: 0;
    list-style: none;
  }

  .cs-tile {
    padding: 18px 12px;
    text-align: center;
    background: var(--cs-tile-bg);
    border: 1px solid var(--cs-line);
    border-radius: 12px;
  }

  .cs-tile-v {
    display: block;
    font-size: 22px;
    font-weight: 800;
    line-height: 1.15;
  }

  .cs-tile-l {
    display: block;
    margin-top: 5px;
    color: var(--cs-muted);
    font-size: 11.5px;
    line-height: 1.4;
  }

  .cs-quote {
    margin: 0 0 26px;
    padding: 18px 20px;
    color: #eef2ff;
    background: var(--cs-tile-bg);
    border: 0;
    border-left: 3px solid color-mix(in srgb, var(--cs-a) 55%, #ffffff);
    border-radius: 10px;
    font-size: 15px;
    font-style: italic;
    line-height: 1.65;
  }

  /* same block, but sitting after the write-up instead of before it */
  .cs-quote.is-closing {
    margin: 30px 0 0;
  }

  .cs-quote footer {
    margin-top: 10px;
    color: var(--cs-muted);
    font-size: 13px;
    font-style: normal;
  }

  /* screenshots, receipts, offer letters: proof that sits above the video */
  .cs-proof {
    display: grid;
    gap: 16px;
    margin: 30px 0 0;
  }

  .cs-proof figure {
    margin: 0;
  }

  /* LinkedIn screenshots run 1200px and taller, which buries the video and
     the CTA. Cap the height and anchor to the top: the author, the headline
     and the announcement all sit up there, and what gets cropped is the
     decorative graphic underneath. Raise the cap to show more. */
  /* GHL themes hand out very large z-indexes, and the form has to clear
     them all. */
  .tf-v1-popup,
  .tf-v1-close-icon {
    z-index: 2147483001 !important;
  }

  .cs-proof img {
    display: block;
    width: 100%;
    height: auto;
    max-height: 440px;
    object-fit: cover;
    object-position: top center;
    background: #ffffff;
    border: 1px solid var(--cs-line);
    border-radius: 10px;
  }

  .cs-proof figcaption {
    margin-top: 8px;
    color: var(--cs-muted);
    font-size: 12px;
    line-height: 1.5;
  }

  .cs-video {
    position: relative;
    margin: 30px 0 0;
    padding-top: 56.25%;
    overflow: hidden;
    background: #000;
    border-radius: 12px;
  }

  .cs-video iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  /* the Wistia web component sizes itself from its aspect attribute, so it
     does not need the padding-top ratio box an iframe does */
  .cs-video.is-wistia {
    padding-top: 0;
  }

  /* blurred poster frame while the player scripts are still loading, which is
     what Wistia's own :not(:defined) rule does */
  .cs-video wistia-player:not(:defined) {
    display: block;
    padding-top: 56.25%;
    background: center / contain no-repeat var(--cs-swatch, none);
    filter: blur(5px);
  }

  .cs-body {
    color: var(--cs-body);
    font-size: 15px;
    line-height: 1.72;
  }

  .cs-sec-label {
    margin: 0 0 8px;
    color: var(--cs-coral);
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 1.4px;
    text-transform: uppercase;
  }

  .cs-sec + .cs-sec {
    margin-top: 24px;
  }

  .cs-sec p {
    margin: 0 0 12px;
  }

  .cs-sec p:last-child {
    margin-bottom: 0;
  }

  .cs-sec ul {
    margin: 0 0 12px;
    padding-left: 20px;
  }

  .cs-sec li {
    margin-bottom: 7px;
  }

  .cs-sec strong {
    color: #fff;
  }

  /* short quotes set inside a section's body copy */
  .cs-sec .cs-pull {
    margin: 18px 0;
    padding-left: 16px;
    color: #fff;
    border-left: 2px solid color-mix(in srgb, var(--cs-a) 50%, #ffffff);
    font-size: 15.5px;
    font-style: italic;
    line-height: 1.6;
  }

  .cs-disclaimer {
    margin: 24px 0 0;
    color: var(--cs-muted);
    font-size: 11.5px;
    line-height: 1.6;
  }

  .cs-cta {
    display: inline-block;
    margin-top: 28px;
    padding: 14px 28px;
    color: #ffffff;
    background: var(--cs-blue);
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.2px;
    text-decoration: none;
    box-shadow: 0 10px 26px rgba(0, 56, 255, 0.35);
    transition: filter 0.18s ease, transform 0.18s ease;
  }

  .cs-cta:hover {
    filter: brightness(1.12);
    transform: translateY(-2px);
  }

  /* --------------------------------------------------------- responsive -- */

              "<p>Tanya was already employed and had no intention of " +
              "leaving. What she did not have were the skills to move up " +
              "where she was. She came in close to the beginning on Excel, " +
              "on analysis, and on SQL.</p>"
          },
          {
            label: "What we did",
            html:
              "<p>Built the skills from the ground up and put mentoring at " +
              "the center of it.</p>" +

              "<ul>" +
                "<li>Excel first, then analysis, then SQL, in that " +
                "order</li>" +
                "<li>1-on-1 mentoring sessions she used consistently, which " +
                "is what moved her faster than the coursework alone would " +
                "have</li>" +
              "</ul>"
          },
          {
            label: "Results",
            html:
              "<p>4 months after starting, Tanya was promoted at the company " +
              "she already worked for, with a salary increase of more than " +
              "$20,000.</p>" +

              "<p>She sent zero applications. No portfolio submitted to " +
              "strangers, no phone screens, no interview rounds, no " +
              "negotiating with a company that did not know her. The skills " +
              "went in and the raise came out of the job she already " +
              "had.</p>"
          }
        ],
        cta: { text: "Book a Free Call" }, // href comes from CONFIG.ctaHref
        disclaimer:
          "Individual results vary. Outcomes depend on effort, prior " +
          "experience, and market conditions. Not all students secure offers."
      }
    }
  ];

  /* ==========================================================================
     3. ENGINE: no need to touch anything below this line
     ========================================================================== */
  /* Pasted twice by accident? The first copy wins and the second bows out,
     rather than both fighting over the same element ids. */
  if (window.__csCaseStudiesLive) return;
  window.__csCaseStudiesLive = true;

  var modal = document.getElementById("cs-modal");
  var dialog = document.getElementById("cs-dialog");
  var inner = document.getElementById("cs-inner");
  var prevBtn = document.getElementById("cs-prev");
  var nextBtn = document.getElementById("cs-next");

  if (!modal) return;

  var current = -1;      // index into CASE_STUDIES
  var active = [];       // the clicked mount's list, what prev / next walks
  var lastFocus = null;
  var scrollLocked = false;

  function esc(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function initials(name) {
    return String(name || "")
      .replace(/\(.*?\)/g, "")
      .trim()
      .split(/\s+/)
      .slice(0, 2)
      .map(function (w) { return w.charAt(0).toUpperCase(); })
      .join("");
  }

  function avatarHTML(cs) {
    if (cs.avatar) {
      return '<span class="cs-avatar"><img src="' + esc(cs.avatar) +
        '" alt="" loading="lazy" decoding="async"></span>';
    }
    return '<span class="cs-avatar" aria-hidden="true">' +
      esc(initials(cs.name)) + "</span>";
  }

  /* Wistia is a web component, not an iframe: it needs player.js plus a small
     per-media module. Both are injected once, the first time a card that uses
     them is opened, so they cost nothing on page load. */
  function addScript(src, isModule, onFail) {
    if (document.querySelector(
      'script[data-cs-src="' + src + '"], script[src="' + src + '"]'
    )) return;
    var el = document.createElement("script");
    el.src = src;
    el.async = true;
    el.setAttribute("data-cs-src", src);
    if (isModule) el.type = "module";
    if (onFail) el.onerror = onFail;
    document.head.appendChild(el);
  }

  var tfPopup = null;
  var tfBlocked = false;

  function log() {
    if (!CONFIG.debug || !window.console) return;
    var a = [].slice.call(arguments);
    a.unshift("[case studies]");
    console.log.apply(console, a);
  }

  /* Loaded at start up rather than on first card open. It is a conversion
     button, so being ready matters more than the 60kb. */
  function ensureTypeform() {
    if (!CONFIG.ctaTypeform) return;

    addScript("https://embed.typeform.com/next/embed.js", false, function () {
      /* Ad and privacy blockers kill this request outright
         (ERR_BLOCKED_BY_CLIENT). Knowing straight away means a click can
         fall back to the apply page immediately instead of appearing dead
         while it waits. */
      tfBlocked = true;
      log("embed.js failed to load, probably blocked. CTA will use the link.");
    });
  }

  function tfReady() {
    return !!(window.tf && typeof window.tf.createPopup === "function");
  }

  /* Forward whatever campaign parameters the page was opened with, then add
     which case study produced the click. */
  function hiddenFields(cardId) {
    var out = {};
    var search = window.location.search || "";

    ["utm_source", "utm_medium", "utm_campaign", "utm_term", "utm_content",
      "gclid"].forEach(function (key) {
      var hit = new RegExp("[?&]" + key + "=([^&#]*)").exec(search);
      if (hit) out[key] = decodeURIComponent(hit[1].replace(/\+/g, " "));
    });

    var field = CONFIG.ctaUTMField || "utm_content";
    if (CONFIG.ctaUTM && cardId && !out[field]) out[field] = cardId;

    return out;
  }

  function showPopup(cardId) {
    /* Hidden fields are baked in when the popup is built, so a popup built
       for one card cannot be reused for the next. */
    if (tfPopup && tfPopup.__csCard !== cardId) {
      if (typeof tfPopup.unmount === "function") tfPopup.unmount();
      tfPopup = null;
    }

    if (!tfPopup) {
      var hidden = hiddenFields(cardId);
      tfPopup = window.tf.createPopup(CONFIG.ctaTypeform, {
        size: 100,
        hidden: hidden
      });
      tfPopup.__csCard = cardId;
      log("popup created for form", CONFIG.ctaTypeform, "hidden:", hidden);
    }

    tfPopup.open();
    log("popup opened");
  }

  /* Wait for the embed rather than silently falling through to a redirect.
     embed.js may still be in flight when someone clicks fast, and a click
     that quietly navigates away is exactly the tracking loss we are trying
     to avoid. Give up after a few seconds and follow the link, so the
     button always does something. */
  function openTypeform(href, cardId) {
    if (tfReady()) return showPopup(cardId);

    if (tfBlocked) {
      log("embed blocked, going straight to", href);
      if (href && href.charAt(0) !== "#") window.location.href = href;
      return;
    }

    log("embed not ready yet, waiting");

    var waited = 0;
    var timer = setInterval(function () {
      if (tfReady()) {
        clearInterval(timer);
        showPopup(cardId);
        return;
      }

      waited += 100;

      if (tfBlocked || waited >= 4000) {
        clearInterval(timer);
        log("embed never loaded, following the link instead:", href);
        if (href && href.charAt(0) !== "#") window.location.href = href;
      }
    }, 100);
  }

  function ensureWistia(id) {
    addScript("https://fast.wistia.com/player.js", false);
    addScript("https://fast.wistia.com/embed/" + id + ".js", true);
  }

  /* esc() output is already safe HTML, so swapping the arrow glyph for a
     styled span here cannot introduce markup from the data */
  function arrows(safeHTML) {
    return safeHTML.replace(/\u2192/g, '<span class="cs-arrow">\u2192</span>');
  }

  /* card headline: coral arrows plus a quieter parenthetical */
  function statHTML(safeHTML) {
    return arrows(safeHTML).replace(
      /\(([^)]*)\)/g,
      '<span class="cs-qual">($1)</span>'
    );
  }

  function quoteHTML(q, extraClass) {
    return '<blockquote class="cs-quote' + (extraClass ? " " + extraClass : "") +
      '">&ldquo;' + esc(q.text) + "&rdquo;" +
      (q.author ? "<footer>" + esc(q.author) + "</footer>" : "") +
      "</blockquote>";
  }

  /* ---------------------------------------------------------------- cards -- */
  /* Resolve one mount's data-cs into an array of indexes into CASE_STUDIES.
     Unknown ids are skipped rather than rendering an empty card, and a mount
     with no data-cs gets everything. */
  function listFor(mount) {
    var raw = (mount.getAttribute("data-cs") || "").trim();
    if (!raw) return CASE_STUDIES.map(function (c, i) { return i; });

    var ids = CASE_STUDIES.map(function (c) { return c.id; });
    var out = [];

    raw.split(",").forEach(function (part) {
      var i = ids.indexOf(part.trim());
      if (i > -1 && out.indexOf(i) < 0) out.push(i);
    });

    return out;
  }

  function renderCards(mount, list) {
    mount.className = "cs-mount cs-wrap" +
      (list.length < 3 ? " cs-n" + list.length : "");

    mount.innerHTML = '<ul class="cs-grid">' + list.map(function (i) {
      var cs = CASE_STUDIES[i];
      var len = String(cs.stat).length;
      var longStat = len > 30 ? " is-xxlong"
        : len > 18 ? " is-xlong"
        : len > 11 ? " is-long" : "";
      if (!cs.statLabel) longStat += " is-solo";

      return (
        '<li>' +
          '<article class="cs-card" data-cs-index="' + i + '" style="--cs-a:' +
            esc(cs.accent) + ";--cs-b:" + esc(cs.accent2 || cs.accent) + '">' +
            '<div class="cs-person">' +
              avatarHTML(cs) +
              "<div>" +
                '<h3 class="cs-name">' + esc(cs.name) + "</h3>" +
                '<p class="cs-cat">' + esc(cs.category) + "</p>" +
              "</div>" +
            "</div>" +
            '<p class="cs-stat' + longStat + '">' + statHTML(esc(cs.stat)) +
              "</p>" +
            (cs.statLabel
              ? '<p class="cs-statlab">' + esc(cs.statLabel) + "</p>"
              : "") +
            '<p class="cs-sum">' + esc(cs.summary) + "</p>" +
            '<button class="cs-more" type="button" aria-haspopup="dialog">' +
              "Full case study" +
              '<span aria-hidden="true">&rarr;</span>' +
              '<span class="cs-sr"> about ' + esc(cs.name) + "</span>" +
            "</button>" +
          "</article>" +
        "</li>"
      );
    }).join("") + "</ul>";
  }

  /* The card's own href wins, otherwise CONFIG.ctaHref. With ctaUTM on, the
     card id rides along as utm_content so you can tell which case study
     actually produced the booking. */
  function ctaHref(cta, cs) {
    var href = cta.href || CONFIG.ctaHref || "#";
    if (!CONFIG.ctaUTM || href.charAt(0) === "#" || !cs.id) return href;

    return href + (href.indexOf("?") > -1 ? "&" : "?") +
      "utm_source=website&utm_medium=case-study" +
      "&utm_campaign=student-stories&utm_content=" +
      encodeURIComponent(cs.id);
  }

  /* ---------------------------------------------------------------- modal -- */
  function renderModal(i) {
    var cs = CASE_STUDIES[i];
    var m = cs.modal || {};
    var html = "";

    dialog.style.setProperty("--cs-a", cs.accent);
    dialog.style.setProperty("--cs-b", cs.accent2 || cs.accent);

    html +=
      '<div class="cs-modal-person">' + avatarHTML(cs) +
        "<div>" +
          '<p class="cs-modal-name">' + esc(m.name || cs.name) + "</p>" +
          '<p class="cs-cat">' + esc(m.category || cs.category) + "</p>" +
          (cs.linkedin
            ? '<a class="cs-verify" href="' + esc(cs.linkedin) +
              '" target="_blank" rel="noopener noreferrer">' +
              "Verify on LinkedIn ↗</a>"
            : "") +
        "</div>" +
      "</div>";

    html += '<h2 class="cs-headline" id="cs-headline">' +
      arrows(esc(m.headline || cs.stat + ": " + cs.name)) + "</h2>";

    /* order: headline, subhead, stat tiles, opening quote, write-up,
       closing quote, proof images, video, CTA, disclaimer */
    if (m.subhead) {
      html += '<p class="cs-subhead">' + esc(m.subhead) + "</p>";
    }

    if (m.stats && m.stats.length) {
      html += '<ul class="cs-stats">' + m.stats.map(function (s) {
        return '<li class="cs-tile"><span class="cs-tile-v">' +
          arrows(esc(s.value)) + '</span><span class="cs-tile-l">' +
          esc(s.label) + "</span></li>";
      }).join("") + "</ul>";
    }

    if (m.quote && m.quote.text) html += quoteHTML(m.quote, "");

    var secs = (m.sections || []).filter(function (s) {
      return s && s.html && s.html.trim();
    });

    if (secs.length) {
      html += '<div class="cs-body">' + secs.map(function (s) {
        return '<div class="cs-sec"><p class="cs-sec-label">' + esc(s.label) +
          "</p>" + s.html + "</div>";
      }).join("") + "</div>";
    }

    if (m.closingQuote && m.closingQuote.text) {
      html += quoteHTML(m.closingQuote, "is-closing");
    }

    /* entries with no src yet are skipped, so a TODO placeholder never
       renders as a broken image */
    var imgs = (m.images || []).filter(function (im) { return im && im.src; });

    if (imgs.length) {
      html += '<div class="cs-proof">' + imgs.map(function (im) {
        return "<figure><img src=\"" + esc(im.src) + '" alt="' +
          esc(im.alt || "") + '" loading="lazy" decoding="async">' +
          (im.caption ? "<figcaption>" + esc(im.caption) + "</figcaption>" : "") +
          "</figure>";
      }).join("") + "</div>";
    }

    if (m.wistia) {
      ensureWistia(m.wistia);
      html += '<div class="cs-video is-wistia">' +
        '<wistia-player media-id="' + esc(m.wistia) +
        '" aspect="1.7777777777777777" style="--cs-swatch:url(' +
        "'https://fast.wistia.com/embed/medias/" + esc(m.wistia) +
        "/swatch')\"></wistia-player></div>";
    } else if (m.video) {
      html += '<div class="cs-video"><iframe src="' + esc(m.video) +
        '" title="' + esc(cs.name) + ' case study video" loading="lazy" ' +
        'allow="autoplay; fullscreen; picture-in-picture" ' +
        "allowfullscreen></iframe></div>";
    }

    if (m.cta && m.cta.text) {
      html += '<a class="cs-cta" href="' + esc(ctaHref(m.cta, cs)) + '">' +
        esc(m.cta.text) + "</a>";
    }

    if (m.disclaimer) {
      html += '<p class="cs-disclaimer">' + esc(m.disclaimer) + "</p>";
    }

    inner.innerHTML = html;
    current = i;

    var multiple = active.length > 1;
    prevBtn.hidden = !multiple;
    nextBtn.hidden = !multiple;

    if (CONFIG.deepLink && cs.id) {
      try {
        history.replaceState(null, "", "#case=" + cs.id);
      } catch (e) { /* file:// or blocked history, harmless */ }
    }
  }

  function lockScroll() {
    if (scrollLocked) return;
    var bar = window.innerWidth - document.documentElement.clientWidth;
    document.documentElement.style.overflow = "hidden";
    if (bar > 0) document.body.style.paddingRight = bar + "px";
    scrollLocked = true;
  }

  function unlockScroll() {
    if (!scrollLocked) return;
    document.documentElement.style.overflow = "";
    document.body.style.paddingRight = "";
    scrollLocked = false;
  }

  function open(i, list) {
    if (i < 0 || i >= CASE_STUDIES.length) return;
    active = list && list.length ? list : [i];
    lastFocus = document.activeElement;
    renderModal(i);
    modal.hidden = false;
    modal.classList.add("is-open");
    lockScroll();
    dialog.scrollTop = 0;
    dialog.focus();
  }

  function close() {
    if (!modal.classList.contains("is-open")) return;
    modal.classList.remove("is-open");
    modal.hidden = true;
    inner.innerHTML = ""; // kills any playing iframe
    unlockScroll();
    current = -1;

    if (CONFIG.deepLink && /#case=/.test(location.hash)) {
      try {
        history.replaceState(null, "", location.pathname + location.search);
      } catch (e) { /* noop */ }
    }

    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  function step(delta) {
    if (current < 0 || !active.length) return;
    var at = active.indexOf(current);
    if (at < 0) return;
    var n = active.length;
    var i = active[((at + delta) % n + n) % n];
    renderModal(i);
    dialog.scrollTop = 0;
    dialog.focus();
  }

  /* ---------------------------------------------------------------- events -- */
  /* Delegated from document, so it covers every mount on the page without
     one listener each. */
  document.addEventListener("click", function (e) {
    if (!e.target.closest) return;
    var card = e.target.closest("[data-cs-index]");
    if (!card) return;
    // let real links inside a card behave normally
    if (e.target.closest("a")) return;

    var mount = card.closest(".cs-mount");
    open(Number(card.getAttribute("data-cs-index")),
      mount ? listFor(mount) : null);
  });

  modal.addEventListener("click", function (e) {
    if (e.target.closest("[data-cs-close]")) return close();

    var cta = e.target.closest(".cs-cta");
    if (!cta) return;

    log("CTA clicked. typeform id:", CONFIG.ctaTypeform || "(none)",
      "| embed loaded:", tfReady());

    if (!CONFIG.ctaTypeform) return;        // plain link, let it navigate

    // let people open the apply page in a new tab if they want to
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.which === 2) return;

    /* Close the case study first. The Typeform popup is full screen, and
       leaving our dialog open underneath means two scroll locks and our
       focus trap fighting the form's iframe for the keyboard. */
    var card = current > -1 ? CASE_STUDIES[current] : null;
    e.preventDefault();
    close();
    openTypeform(cta.getAttribute("href"), card ? card.id : "");
  });

  prevBtn.addEventListener("click", function () { step(-1); });
  nextBtn.addEventListener("click", function () { step(1); });

  document.addEventListener("keydown", function (e) {
    if (!modal.classList.contains("is-open")) return;

    if (e.key === "Escape") {
      close();
      return;
    }

    if (CONFIG.arrowKeys && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) {
      if (e.key === "ArrowLeft") { step(-1); return; }
      if (e.key === "ArrowRight") { step(1); return; }
    }

    if (e.key !== "Tab") return;

    // focus trap
    var f = dialog.querySelectorAll(
      'a[href], button:not([disabled]):not([hidden]), iframe, [tabindex]:not([tabindex="-1"])'
    );
    var list = Array.prototype.filter.call(f, function (el) {
      return el.offsetParent !== null || el === dialog;
    });
    if (!list.length) return;

    var first = list[0];
    var last = list[list.length - 1];

    if (e.shiftKey && (document.activeElement === first || document.activeElement === dialog)) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  });

  /* ------------------------------------------------------------------ boot -- */
  // Move the modal to <body> so GHL wrappers with overflow/transform can't
  // clip it or trap it behind other page elements.
  if (modal.parentNode !== document.body) document.body.appendChild(modal);

  /* Render every mount we can see. Mounts already done are skipped, so this
     is safe to call more than once. */
  function scan() {
    var found = [].slice.call(document.querySelectorAll(".cs-mount"));
    var lists = [];

    found.forEach(function (mount) {
      var list = listFor(mount);
      lists.push(list);
      if (mount.getAttribute("data-cs-ready")) return;
      renderCards(mount, list);
      mount.setAttribute("data-cs-ready", "1");
    });

    return lists;
  }

  function deepLink(lists) {
    if (!CONFIG.deepLink || current > -1) return;

    var match = /#case=([\w-]+)/.exec(location.hash);
    if (!match) return;

    var idx = CASE_STUDIES.map(function (c) { return c.id; }).indexOf(match[1]);
    if (idx < 0) return;

    // open it in whichever group holds it, so the arrows stay consistent
    var owner = null;
    lists.forEach(function (l) {
      if (!owner && l.indexOf(idx) > -1) owner = l;
    });

    open(idx, owner);
  }

  /* A mount can sit anywhere on the page, including further down than this
     script, in which case it does not exist yet at this point. So wait for
     the document, then sweep again on load in case GHL injected a section
     late. */
  function boot() {
    ensureTypeform();
    log("booted. typeform id:", CONFIG.ctaTypeform || "(none)",
      "| cta href:", CONFIG.ctaHref);
    deepLink(scan());
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }

  window.addEventListener("load", function () { deepLink(scan()); });
})();
</script>
